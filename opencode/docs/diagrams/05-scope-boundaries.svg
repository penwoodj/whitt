  <!-- Column Headers -->
  <rect x="30" y="75" width="270" height="35" rx="6" fill="#7aa2f7"/>
  <text x="165" y="97" text-anchor="middle" fill="#1a1b26" font-size="13" font-weight="bold">yaml-to-rust-agentsdk</text>

  <rect x="315" y="75" width="270" height="35" rx="6" fill="#9ece6a"/>
  <text x="450" y="97" text-anchor="middle" fill="#1a1b26" font-size="13" font-weight="bold">agent-queue</text>

