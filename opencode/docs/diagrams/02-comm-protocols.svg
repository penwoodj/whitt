<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- Background -->
  <rect x="0" y="0" width="1200" height="800" fill="#1a1b26"/>

  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0caf5"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ece6a"/>
    </marker>
  </defs>

  <!-- Version label -->
  <text x="1150" y="30" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="end">whitt architecture diagrams v1.0</text>

  <!-- Title -->
  <text x="600" y="60" fill="#c0caf5" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold">Communication Protocols - CLI Subprocess JSON</text>

  <!-- Protocol 1: Whitt → yaml-to-rust-agentsdk -->
  <rect x="50" y="100" width="1100" height="140" rx="10" fill="#24283b" stroke="#7aa2f7" stroke-width="2"/>
  <text x="70" y="130" fill="#7aa2f7" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Protocol 1: Whitt → yaml-to-rust-agentsdk</text>

  <!-- Command boxes -->
  <rect x="70" y="150" width="200" height="80" rx="5" fill="#1a1b26" stroke="#7aa2f7" stroke-width="1"/>
  <text x="170" y="175" fill="#c0caf5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">compile</text>
  <text x="170" y="192" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">input: {yaml: string}</text>
  <text x="170" y="207" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">output: {steps: array}</text>

  <rect x="290" y="150" width="200" height="80" rx="5" fill="#1a1b26" stroke="#7aa2f7" stroke-width="1"/>
  <text x="390" y="175" fill="#c0caf5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">execute</text>
  <text x="390" y="192" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">input: {step: object}</text>
  <text x="390" y="207" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">output: {result: any}</text>

  <rect x="510" y="150" width="200" height="80" rx="5" fill="#1a1b26" stroke="#7aa2f7" stroke-width="1"/>
  <text x="610" y="175" fill="#c0caf5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">validate</text>
  <text x="610" y="192" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">input: {yaml: string}</text>
  <text x="610" y="207" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">output: {valid: bool}</text>

  <rect x="730" y="150" width="200" height="80" rx="5" fill="#1a1b26" stroke="#7aa2f7" stroke-width="1"/>
  <text x="830" y="175" fill="#c0caf5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">backends list</text>
  <text x="830" y="192" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">input: {}</text>
  <text x="830" y="207" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">output: {backends: array}</text>

  <text x="1000" y="185" fill="#737aa2" font-family="Arial, sans-serif" font-size="10">Channel: STDIN/STDOUT</text>
  <text x="1000" y="205" fill="#737aa2" font-family="Arial, sans-serif" font-size="10">Format: JSON lines</text>
  <text x="1000" y="225" fill="#737aa2" font-family="Arial, sans-serif" font-size="10">Error handling: JSON error</text>

  <!-- Protocol 2: Whitt → agent-queue -->
  <rect x="50" y="260" width="1100" height="140" rx="10" fill="#24283b" stroke="#9ece6a" stroke-width="2"/>
  <text x="70" y="290" fill="#9ece6a" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Protocol 2: Whitt → agent-queue</text>

  <!-- Command boxes -->
  <rect x="70" y="310" width="200" height="80" rx="5" fill="#1a1b26" stroke="#9ece6a" stroke-width="1"/>
  <text x="170" y="335" fill="#c0caf5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">enqueue</text>
  <text x="170" y="352" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">input: {task: object}</text>
  <text x="170" y="367" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">output: {id: string}</text>

  <rect x="290" y="310" width="200" height="80" rx="5" fill="#1a1b26" stroke="#9ece6a" stroke-width="1"/>
  <text x="390" y="335" fill="#c0caf5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">list</text>
  <text x="390" y="352" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">input: {filter: object}</text>
  <text x="390" y="367" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">output: {tasks: array}</text>

  <rect x="510" y="310" width="200" height="80" rx="5" fill="#1a1b26" stroke="#9ece6a" stroke-width="1"/>
  <text x="610" y="335" fill="#c0caf5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">inspect</text>
  <text x="610" y="352" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">input: {id: string}</text>
  <text x="610" y="367" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">output: {task: object}</text>

  <rect x="730" y="310" width="200" height="80" rx="5" fill="#1a1b26" stroke="#9ece6a" stroke-width="1"/>
  <text x="830" y="335" fill="#c0caf5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">cancel</text>
  <text x="830" y="352" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">input: {id: string}</text>
  <text x="830" y="367" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">output: {success: bool}</text>

  <text x="1000" y="345" fill="#737aa2" font-family="Arial, sans-serif" font-size="10">Channel: STDIN/STDOUT</text>
  <text x="1000" y="365" fill="#737aa2" font-family="Arial, sans-serif" font-size="10">Format: JSON lines</text>
  <text x="1000" y="385" fill="#737aa2" font-family="Arial, sans-serif" font-size="10">Async: task IDs returned</text>

  <!-- Protocol 3: agent-queue → yaml-to-rust-agentsdk -->
  <rect x="50" y="420" width="1100" height="140" rx="10" fill="#24283b" stroke="#e0af68" stroke-width="2"/>
  <text x="70" y="450" fill="#e0af68" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Protocol 3: agent-queue → yaml-to-rust-agentsdk (Dispatch Execution)</text>

  <!-- Command box -->
  <rect x="70" y="470" width="300" height="80" rx="5" fill="#1a1b26" stroke="#e0af68" stroke-width="1"/>
  <text x="220" y="495" fill="#c0caf5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">dispatch</text>
  <text x="220" y="512" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">input: {task_id: string, step: object}</text>
  <text x="220" y="527" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">output: {step_id: string, status: string}</text>

  <!-- Flow diagram -->
  <text x="400" y="495" fill="#737aa2" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Flow:</text>
  <text x="400" y="515" fill="#c0caf5" font-family="Arial, sans-serif" font-size="10">1. agent-queue leases task</text>
  <text x="400" y="532" fill="#c0caf5" font-family="Arial, sans-serif" font-size="10">2. dispatches to agentsdk</text>
  <text x="400" y="549" fill="#c0caf5" font-family="Arial, sans-serif" font-size="10">3. agentsdk executes step</text>
  <text x="600" y="515" fill="#c0caf5" font-family="Arial, sans-serif" font-size="10">4. returns step result</text>
  <text x="600" y="532" fill="#c0caf5" font-family="Arial, sans-serif" font-size="10">5. agent-queue updates state</text>
  <text x="600" y="549" fill="#c0caf5" font-family="Arial, sans-serif" font-size="10">6. schedules next step</text>

  <text x="830" y="505" fill="#737aa2" font-family="Arial, sans-serif" font-size="10">Channel: CLI subprocess</text>
  <text x="830" y="525" fill="#737aa2" font-family="Arial, sans-serif" font-size="10">Retry: Configurable per task</text>
  <text x="830" y="545" fill="#737aa2" font-family="Arial, sans-serif" font-size="10">Timeout: Per task limits</text>

  <!-- Protocol 4: Whitt → model-router (Future) -->
  <rect x="50" y="580" width="1100" height="140" rx="10" fill="#24283b" stroke="#bb9af7" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="70" y="610" fill="#bb9af7" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Protocol 4: Whitt → model-router (FUTURE)</text>

  <!-- Command box -->
  <rect x="70" y="630" width="300" height="80" rx="5" fill="#1a1b26" stroke="#bb9af7" stroke-width="1"/>
  <text x="220" y="655" fill="#c0caf5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">route</text>
  <text x="220" y="672" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">input: {task_type, complexity, budget}</text>
  <text x="220" y="687" fill="#737aa2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">output: {model, cost_estimate}</text>

  <!-- Future notes -->
  <text x="400" y="655" fill="#bb9af7" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Planned Features:</text>
  <text x="400" y="675" fill="#c0caf5" font-family="Arial, sans-serif" font-size="10">• Multi-model routing (GPT-4, Claude, etc.)</text>
  <text x="400" y="692" fill="#c0caf5" font-family="Arial, sans-serif" font-size="10">• Cost optimization based on task type</text>
  <text x="400" y="709" fill="#c0caf5" font-family="Arial, sans-serif" font-size="10">• Budget tracking per user</text>
  <text x="400" y="726" fill="#c0caf5" font-family="Arial, sans-serif" font-size="10">• Fallback chains for reliability</text>

  <text x="830" y="665" fill="#bb9af7" font-family="Arial, sans-serif" font-size="10">Status: PLANNED (v2.0)</text>
  <text x="830" y="685" fill="#bb9af7" font-family="Arial, sans-serif" font-size="10">MVP: Manual model selection</text>
  <text x="830" y="705" fill="#bb9af7" font-family="Arial, sans-serif" font-size="10">Future: AI-driven routing</text>

  <!-- Key notes at bottom -->
  <rect x="50" y="740" width="1100" height="50" rx="10" fill="#16161e" stroke="#565f89" stroke-width="1"/>
  <text x="600" y="765" fill="#737aa2" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">Protocol Design Notes</text>
  <text x="600" y="780" fill="#c0caf5" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">All protocols use structured JSON over stdin/stdout. Error responses include {error: string, code: string, details: object}. Async operations return task IDs for polling.</text>
</svg>
